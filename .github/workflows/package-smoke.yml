name: package-smoke

on:
  pull_request:
  push:

jobs:
  build-and-wheel-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install built wheel in a clean venv
        run: |
          python -m venv .pkg-venv
          source .pkg-venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          python - <<'PY'
          from cartellino_parser import PipelineClient
          from cartellino_parser.models import ExtractEventsRequest, PipelineRunResult
          from cartellino_parser.pipeline_paths import build_pipeline_paths
          from cartellino_parser.sources import DriveAuthConfig

          client = PipelineClient()
          request = ExtractEventsRequest(input_dir="output/demo/documents", output_dir="output/demo/events")
          paths = build_pipeline_paths("output/demo")

          print(client.__class__.__name__)
          print(request.__class__.__name__)
          print(PipelineRunResult.__name__)
          print(DriveAuthConfig.__name__)
          print(paths.__class__.__name__)
          PY
