[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cartellino-parser"
version = "0.1.0"
description = "Parser for Cartellino mensile configurabile PDFs"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Rosario" }]
keywords = [
  "cartellino",
  "healthcare",
  "pdf",
  "pipeline",
  "shift-processing",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "pdfplumber>=0.10.4",
  "pandas>=2.1.0,<2.3",
  "holidays>=0.41",
  "pydantic>=2.0",
  "reportlab>=4.0",
]

[project.urls]
Homepage = "https://github.com/RosarioDiBartolo/Nursind"
Repository = "https://github.com/RosarioDiBartolo/Nursind"
Issues = "https://github.com/RosarioDiBartolo/Nursind/issues"

[project.scripts]
drive-scan = "cartellino_parser.scan_directory.cli:main"
cartellino-drive-scan = "cartellino_parser.scan_directory.cli:main"
cartellino-extract-documents = "cartellino_parser.extract_documents_from_index.__main__:main"
cartellino-extract-events = "cartellino_parser.extract_events_from_documents.cli:main"
cartellino-parser-recall-audit = "cartellino_parser.parser_recall_audit.cli:main"
cartellino-filter-midnight = "cartellino_parser.filter_midnight_events.cli:main"
cartellino-pair-employee-events = "cartellino_parser.pair_employee_events.cli:main"
cartellino-turni-enrichment = "cartellino_parser.turni_enrichment.cli:main"
cartellino-turni-afternoon-long = "cartellino_parser.turni_afternoon_long_export.cli:main"
cartellino-turni-summary = "cartellino_parser.turni_employee_summary.cli:main"
cartellino-missing-timbrature = "cartellino_parser.timbrature_missing_report.cli:main"
cartellino-download-from-index = "cartellino_parser.download_from_index:main"
cartellino-index-convert = "cartellino_parser.drive_service.index.cli:main"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=7.4",
  "ruff>=0.6",
  "mypy>=1.11",
]
google = [
  "python-dotenv>=1.0",
  "google-auth>=2.0",
  "google-auth-oauthlib>=1.0",
  "google-api-python-client>=2.0",
]

[tool.setuptools]
packages = [
  "cartellino_parser",
  "cartellino_parser.drive_service",
  "cartellino_parser.drive_service.index",
  "cartellino_parser.extract_documents_from_index",
  "cartellino_parser.extract_events_from_documents",
  "cartellino_parser.extract_events_from_documents.parsers",
  "cartellino_parser.filter_midnight_events",
  "cartellino_parser.notebooks",
  "cartellino_parser.pair_employee_events",
  "cartellino_parser.parser_recall_audit",
  "cartellino_parser.scan_directory",
  "cartellino_parser.turni_afternoon_long_export",
  "cartellino_parser.timbrature_missing_report",
  "cartellino_parser.turni_employee_summary",
  "cartellino_parser.turni_enrichment",
]
py-modules = [
  "download_from_index",
  "pdf_text_extraction",
  "pipeline_paths",
  "pipeline_path_types",
  "raw_text_parsing",
  "reporting",
  "shift_services",
]
include-package-data = false

[tool.setuptools.package-dir]
"" = "src"
"cartellino_parser.drive_service" = "src/drive_service"
"cartellino_parser.drive_service.index" = "src/drive_service/index"
"cartellino_parser.extract_documents_from_index" = "src/extract_documents_from_index"
"cartellino_parser.extract_events_from_documents" = "src/extract_events_from_documents"
"cartellino_parser.extract_events_from_documents.parsers" = "src/extract_events_from_documents/parsers"
"cartellino_parser.filter_midnight_events" = "src/filter_midnight_events"
"cartellino_parser.notebooks" = "src/notebooks"
"cartellino_parser.pair_employee_events" = "src/pair_employee_events"
"cartellino_parser.parser_recall_audit" = "src/parser_recall_audit"
"cartellino_parser.scan_directory" = "src/scan_directory"
"cartellino_parser.turni_afternoon_long_export" = "src/turni_afternoon_long_export"
"cartellino_parser.timbrature_missing_report" = "src/timbrature_missing_report"
"cartellino_parser.turni_employee_summary" = "src/turni_employee_summary"
"cartellino_parser.turni_enrichment" = "src/turni_enrichment"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["F"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
explicit_package_bases = true
files = [
  "src/cartellino_parser",
  "src/reporting.py",
  "src/extract_events_from_documents",
  "src/filter_midnight_events",
  "src/parser_recall_audit",
  "src/timbrature_missing_report",
  "src/turni_enrichment",
  "src/turni_employee_summary",
]
