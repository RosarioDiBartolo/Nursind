[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cartellino-parser"
version = "0.1.0"
description = "Parser for Cartellino mensile configurabile PDFs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pdfplumber>=0.10.4",
  "pandas>=2.1.0",
  "holidays>=0.41",
]

[project.scripts]
drive-scan = "src.scan_directory.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["F"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
explicit_package_bases = true
files = [
  "src/reporting.py",
  "src/extract_events_from_documents",
  "src/filter_midnight_events",
  "src/parser_recall_audit",
  "src/timbrature_missing_report",
  "src/turni_enrichment",
  "src/turni_employee_summary",
]
